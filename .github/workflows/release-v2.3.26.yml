name: Release v2.3.26

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release-v2.3.26.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 6fad13969a104d1def557c8ba75764434061a492
      TAG: v2.3.26
      ASSET: ssbhesabfa-v2.3.26.zip
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          grep -Fq "\$this->version = '2.3.26';" ssbhesabfa.php
          grep -Fq '<version>2.3.26</version>' config.xml
          grep -Fq '<version>2.3.26</version>' config_fa.xml
          test -f upgrade/upgrade-2.3.26.php
          grep -Fq 'function upgrade_module_2_3_26' upgrade/upgrade-2.3.26.php
          grep -Fq 'SSBHESABFA_ITEM_CODE_AS_REFERENCE' ssbhesabfa.php
          grep -Fq 'public static function syncAllProductReferences()' classes/HesabfaMappingRepository.php
          grep -Fq 'private static function syncProductReference' classes/HesabfaMappingRepository.php
          grep -Fq 'PRODUCT_REFERENCE_SYNC_FAILED' classes/HesabfaMappingRepository.php
          grep -Fq 'CUSTOMER_SYNC_PENDING' classes/services/HesabfaQueueService.php
          grep -Fq "\$requestIdsCreatedAt === '0000-00-00 00:00:00'" classes/HesabfaJobRepository.php
          find . -path './.git' -prune -o -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('config.xml'); ET.parse('config_fa.xml')"

      - name: Build installable module archive
        shell: bash
        run: |
          set -euo pipefail
          git archive \
            --format=zip \
            --prefix=ssbhesabfa/ \
            --output="$ASSET" \
            "$TARGET_SHA" \
            -- . ':(exclude).gitattributes' ':(exclude).gitignore'
          unzip -t "$ASSET"
          test "$(unzip -Z1 "$ASSET" | awk '/\.php$/ { count++ } END { print count + 0 }')" -eq 76
          test "$(unzip -Z1 "$ASSET" | awk '/(^|\/)config(_fa)?\.xml$/ { count++ } END { print count + 0 }')" -eq 2
          test "$(unzip -Z1 "$ASSET" | awk '!/^ssbhesabfa\// { count++ } END { print count + 0 }')" -eq 0
          unzip -Z1 "$ASSET" | grep -Fqx 'ssbhesabfa/upgrade/upgrade-2.3.26.php'
          if unzip -Z1 "$ASSET" | grep -Eiq '(^|/)AGENTS\.md$|(^|/)\.git/|\.bak([.-]|$)|\.log$|(^|/)\.env($|\.)'; then
            echo 'Development, secret, or backup file found in release archive.' >&2
            exit 1
          fi
          sha256sum "$ASSET"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi
          printf '%s\n' \
            '## Changes' \
            '' \
            '- Adds an optional catalog setting that mirrors mapped Hesabfa item codes into PrestaShop product and combination references.' \
            '- Backfills all existing references when the setting is enabled and updates future mapping writes immediately.' \
            '- Keeps the mapping authoritative and logs a repairable error if a reference write fails.' \
            '- Batches invoice-webhook item retrieval and safely skips remote items that no longer exist.' \
            '- Recovers customer/address queue dependencies, retries transient failures, and resolves completed payment-mapping issues.' \
            '- Preserves request UUID creation timestamps for legacy zero-date rows.' \
            '- Adds a versioned upgrade handler; the new reference option remains disabled by default.' \
            '' \
            '## Package' \
            '' \
            'Upload ssbhesabfa-v2.3.26.zip through PrestaShop Module Manager and run the module upgrade action.' \
            '' \
            'Validation: 76 PHP files parsed successfully, two XML files validated, release invariants checked, and the installable ZIP integrity was verified.' \
            > release-notes.md
          gh release create "$TAG" "$ASSET" \
            --target "$TARGET_SHA" \
            --title 'SSB Hesabfa v2.3.26' \
            --notes-file release-notes.md \
            --latest
