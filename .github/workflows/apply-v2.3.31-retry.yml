name: Retry reviewed v2.3.31 changes

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-v2.3.31-retry.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    env:
      CODE_BASE_SHA: 5c473cac31da0ae002cf0beb8b2c991226c48bd4
      PATCH_SHA256: 414e292354b3426e6bd98537b4f2b54e03a77e8909b5fb8f92867690ca84b68f
      PATCH_URL: https://iphonechi.com/5c482f8a800038636b0c75d25ff4b5a8.txt

    steps:
      - name: Check out trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only "$CODE_BASE_SHA" HEAD | grep -v '^\.github/workflows/' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected source changes since reviewed base:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          curl -fL --retry 3 --connect-timeout 20 \
            "$PATCH_URL?run=$GITHUB_RUN_ID" \
            -o /tmp/ssbhesabfa-v2.3.31.patch
          echo "$PATCH_SHA256  /tmp/ssbhesabfa-v2.3.31.patch" | sha256sum -c -
          git apply --check /tmp/ssbhesabfa-v2.3.31.patch
          git apply /tmp/ssbhesabfa-v2.3.31.patch
          rm .github/workflows/apply-v2.3.31.yml
          rm .github/workflows/apply-v2.3.31-retry.yml
          git diff --check

      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: none

      - name: Run compatibility and accounting regression tests
        shell: bash
        run: |
          set -euo pipefail
          php -v | grep -Fq 'PHP 7.4.'
          find . \
            -path './.git' -prune -o \
            -path './src' -prune -o \
            -path './vendor' -prune -o \
            -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

          cat > /tmp/ssbhesabfa-v2.3.31-regression.php <<'PHP'
          <?php

          define('_PS_VERSION_', '8.1.7');

          class Configuration
          {
              public static $values = array();

              public static function get($key)
              {
                  return array_key_exists($key, self::$values) ? self::$values[$key] : false;
              }

              public static function updateValue($key, $value)
              {
                  self::$values[$key] = $value;
                  return true;
              }
          }

          class Validate
          {
              public static function isLoadedObject($object)
              {
                  return is_object($object);
              }
          }

          class HesabfaPrestashopRepository
          {
              public static function getOrderModuleName($idOrder)
              {
                  return $idOrder === 29864 ? 'psy_paymenthelper' : '';
              }
          }

          require getenv('GITHUB_WORKSPACE') . '/classes/services/HesabfaPaymentFeeService.php';
          require getenv('GITHUB_WORKSPACE') . '/classes/traits/HesabfaPaymentTrait.php';
          require getenv('GITHUB_WORKSPACE') . '/upgrade/upgrade-2.3.31.php';

          class PaymentResolverHarness
          {
              use HesabfaPaymentTrait;

              private $methods;

              public function __construct(array $methods)
              {
                  $this->methods = $methods;
              }

              public function getPaymentMethodsName()
              {
                  return $this->methods;
              }
          }

          $legacyKey = 'SSBHESABFA_PAYMENT_METHOD_' . md5('psy_paymenthelper|تکنوپی');
          $activeKey = 'SSBHESABFA_PAYMENT_METHOD_' . md5('psy_paymenthelper|درگاه پرداخت تکنوپی');
          Configuration::$values = array(
              $legacyKey => '0032',
              $legacyKey . '_CUSTOMER_CHARGE_PERCENT' => '6.5',
              $activeKey => '0032',
              $activeKey . '_FEE_PAYER' => 'customer',
              $activeKey . '_FEE_TYPE' => 'percent',
              $activeKey . '_FEE_PERCENT' => '5.5',
              $activeKey . '_CUSTOMER_CHARGE_PERCENT' => '7.5',
              $activeKey . '_INCOME_ACCOUNT_PATH' => 'Accounts Receivable',
              $activeKey . '_FEE_INCOME_CONTACT_CODE' => '061945',
          );

          $resolver = new PaymentResolverHarness(array(array(
              'name' => 'درگاه پرداخت تکنوپی',
              'module' => 'psy_paymenthelper',
              'id' => $activeKey,
          )));
          $resolved = $resolver->getPaymentConfigByOrderPayment(29864, 'تکنوپی');
          if (!is_array($resolved) || $resolved['configuration_name'] !== $activeKey) {
              fwrite(STDERR, "Active Payment Helper configuration precedence failed.\n");
              exit(1);
          }

          $breakdown = HesabfaPaymentFeeService::getBreakdown($activeKey, 2353175000);
          $expected = array(
              'invoice_payment_amount' => 2189000000,
              'income_amount' => 34750375,
              'fee_percent' => 5.5,
              'customer_charge_percent' => 7.5,
              'income_percent' => 1.5875,
          );
          foreach ($expected as $key => $value) {
              if (!isset($breakdown[$key]) || (float) $breakdown[$key] !== (float) $value) {
                  fwrite(STDERR, $key . " mismatch.\n");
                  exit(1);
              }
          }

          Configuration::$values = array(
              'SSBHESABFA_FEE_INCOME_DOCUMENT_DESCRIPTION_TEMPLATE' => 'درآمد کارمزد پرداخت آنلاین - فاکتور {invoice_number} - مرجع سفارش: {order_reference}',
              'SSBHESABFA_MANUAL_FEE_INCOME_DOCUMENT_DESCRIPTION_TEMPLATE' => 'Custom manual template',
          );
          if (!upgrade_module_2_3_31(new stdClass())) {
              fwrite(STDERR, "Template upgrade returned false.\n");
              exit(1);
          }
          $onlineTemplate = Configuration::$values['SSBHESABFA_FEE_INCOME_DOCUMENT_DESCRIPTION_TEMPLATE'];
          foreach (array('{customer_charge_percent}', '{fee_percent}', '{income_percent}') as $placeholder) {
              if (strpos($onlineTemplate, $placeholder) === false) {
                  fwrite(STDERR, "Missing upgraded placeholder: " . $placeholder . "\n");
                  exit(1);
              }
          }
          if (Configuration::$values['SSBHESABFA_MANUAL_FEE_INCOME_DOCUMENT_DESCRIPTION_TEMPLATE'] !== 'Custom manual template') {
              fwrite(STDERR, "Custom template was overwritten.\n");
              exit(1);
          }

          echo "Resolver, Technopay rates, and safe template migration passed.\n";
          PHP
          php /tmp/ssbhesabfa-v2.3.31-regression.php

      - name: Set up PHP 8.1 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Validate complete source
        shell: bash
        run: |
          set -euo pipefail
          php -v | grep -Fq 'PHP 8.1.'
          grep -Fq "\$this->version = '2.3.31';" ssbhesabfa.php
          grep -Fq '<version>2.3.31</version>' config.xml
          grep -Fq '<version>2.3.31</version>' config_fa.xml
          grep -Fq '**Current version:** `2.3.31`' Readme.md
          grep -Fq '## 2.3.31' CHANGELOG.md
          test -f upgrade/upgrade-2.3.31.php
          grep -Fq 'function upgrade_module_2_3_31' upgrade/upgrade-2.3.31.php
          test "$(find . -path './.git' -prune -o -type f -name '*.php' -print | wc -l)" -eq 82
          find . -path './.git' -prune -o -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 -c "import json, xml.etree.ElementTree as ET; json.load(open('composer.json')); ET.parse('config.xml'); ET.parse('config_fa.xml')"
          composer validate --no-check-publish
          composer dump-autoload --no-dev --classmap-authoritative
          php -r "require 'vendor/autoload.php'; exit(class_exists('SsbHesabfa\\Mcp\\HesabfaTools') ? 0 : 1);"
          git diff --check

      - name: Commit tested changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: include payment rates in fee income descriptions'
          git push origin HEAD:master
