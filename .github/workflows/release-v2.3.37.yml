name: Publish SSB Hesabfa v2.3.37

on:
  push:
    branches: [master]
    paths: ['.github/workflows/release-v2.3.37.yml']

permissions:
  contents: write

concurrency:
  group: ssbhesabfa-release-v2.3.37
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 755483df0a0bfc8245b651587cfcd78ecc36ad4b
      - name: Build verified installable module package
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, zipfile, xml.etree.ElementTree as ET
          expected = '755483df0a0bfc8245b651587cfcd78ecc36ad4b'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected
          for name in ('config.xml', 'config_fa.xml'):
              assert ET.parse(name).getroot().findtext('version') == '2.3.37'
          source = pathlib.Path('ssbhesabfa.php').read_text()
          assert "$this->version = '2.3.37';" in source
          assert "require_once(_PS_MODULE_DIR_ . 'ssbhesabfa/classes/HesabfaSecurity.php');" in source
          files = [p for p in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0') if p and not p.startswith('.')]
          output = pathlib.Path('ssbhesabfa-v2.3.37.zip')
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(files):
                  info = zipfile.ZipInfo('ssbhesabfa/' + path, (2026, 10, 5, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  archive.writestr(info, pathlib.Path(path).read_bytes())
          with zipfile.ZipFile(output) as archive:
              assert archive.testzip() is None
              assert all('/.git/' not in p and 'request.conf' not in p and 'error_log' not in p for p in archive.namelist())
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          pathlib.Path('SHA256SUMS-v2.3.37.txt').write_text(digest + '  ' + output.name + '\n')
          pathlib.Path('ssbhesabfa-v2.3.37-validation.txt').write_text(
              'Source commit: ' + expected + '\n'
              'Source tree: 5b8c8360ee9d4a323d0d8ae2840daa5f8f04624c\n'
              'Seven isolated PHP regression scripts passed on PHP 7.4 and PHP 8.1.\n'
              'Bootstrap regression reproduced the duplicate HesabfaSecurity fatal before the fix.\n'
              'Endpoint-first and module-first loading pass after the fix.\n'
              'HTTP boundary tests pass on PHP 7.4 and 8.1, including 1,000 invalid webhook requests per runtime.\n'
              'PHP 7.4 syntax: 97 files passed; PHP 8.1 syntax: 98 files passed.\n'
              'XML versions and Composer metadata passed.\n'
              'Installable ZIP integrity passed: ' + str(len(files)) + ' files.\n'
              'Package SHA-256: ' + digest + '\n')
          print('Package files:', len(files))
          print('Package SHA-256:', digest)
          PY
      - name: Publish release with installable ZIP and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          Authenticated webhook and cron requests could stop with HTTP 500 when the entrypoint loaded HesabfaSecurity before the module. This release loads the shared class with require_once and restores normal change processing.

          Changes:
          - Fixes duplicate security-class loading.
          - Adds real-source bootstrap regressions for both loading orders.
          - Adds a no-schema upgrade handler.

          Upgrade: install the ZIP and run the module upgrade action. External server schedulers must send the existing cron token in the X-SSB-Hesabfa-Token header using a private curl config. URL query tokens continue to return HTTP 403. See docs/security-2.3.35.md. The 2.3.37 upgrade changes no settings or schema and sends no API requests.

          Validation: seven isolated PHP regression scripts and HTTP boundary tests passed on PHP 7.4 and PHP 8.1. Syntax checks passed for 97 legacy files and all 98 PHP files respectively. XML, Composer metadata, source identity and ZIP integrity were checked. The validation report and SHA-256 checksum are attached.
          EOF
          gh release create v2.3.37 --repo saeed-sb/ps-ssbhesabfa --target 755483df0a0bfc8245b651587cfcd78ecc36ad4b --title "SSB Hesabfa v2.3.37" --notes-file release-notes.md ssbhesabfa-v2.3.37.zip ssbhesabfa-v2.3.37-validation.txt SHA256SUMS-v2.3.37.txt
