name: Release v2.3.28

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release-v2.3.28.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 268f958997c4f1be6646a6d855d024e38cc45e1e
      TAG: v2.3.28
      ASSET: ssbhesabfa-v2.3.28.zip
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: none

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          php -v | grep -Fq 'PHP 8.1.'
          grep -Fq "\$this->version = '2.3.28';" ssbhesabfa.php
          grep -Fq '<version>2.3.28</version>' config.xml
          grep -Fq '<version>2.3.28</version>' config_fa.xml
          grep -Fq '**Current version:** `2.3.28`' Readme.md
          grep -Fq '## 2.3.28' CHANGELOG.md
          test -f upgrade/upgrade-2.3.28.php
          grep -Fq 'function upgrade_module_2_3_28' upgrade/upgrade-2.3.28.php
          grep -Fq 'die(json_encode($response));' controllers/admin/AdminSsbHesabfaSyncController.php
          if grep -R -n --include='*.php' -E 'Tools::jsonEncode|Tools::jsonDecode' .; then
            echo 'Removed Tools JSON helper is still present.' >&2
            exit 1
          fi
          git diff --check "$TARGET_SHA^" "$TARGET_SHA"
          find . -path './.git' -prune -o -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l
          test "$(find . -path './.git' -prune -o -type f -name '*.php' -print | wc -l)" -eq 78
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('config.xml'); ET.parse('config_fa.xml')"

      - name: Build installable module archive
        shell: bash
        run: |
          set -euo pipefail
          git archive \
            --format=zip \
            --prefix=ssbhesabfa/ \
            --output="$ASSET" \
            "$TARGET_SHA" \
            -- . ':(exclude).gitattributes' ':(exclude).gitignore'
          unzip -t "$ASSET"
          test "$(unzip -Z1 "$ASSET" | awk '/\.php$/ { count++ } END { print count + 0 }')" -eq 78
          test "$(unzip -Z1 "$ASSET" | awk '/(^|\/)config(_fa)?\.xml$/ { count++ } END { print count + 0 }')" -eq 2
          test "$(unzip -Z1 "$ASSET" | awk '!/^ssbhesabfa\// { count++ } END { print count + 0 }')" -eq 0
          unzip -Z1 "$ASSET" | grep -Fqx 'ssbhesabfa/upgrade/upgrade-2.3.28.php'
          if unzip -Z1 "$ASSET" | grep -Eiq '(^|/)AGENTS\.md$|(^|/)\.git/|\.bak([.-]|$)|\.log$|(^|/)\.env($|\.)'; then
            echo 'Development, secret, or backup file found in release archive.' >&2
            exit 1
          fi
          sha256sum "$ASSET"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi
          printf '%s\n' \
            '## Changes' \
            '' \
            '- Replaces the removed Tools::jsonEncode() call in the admin batch-export AJAX response with native json_encode().' \
            '- Preserves the existing JSON response contract on PHP 7.4 and PHP 8.1.' \
            '- Adds a no-schema upgrade handler; existing Hesabfa settings, mappings, queues, logs, and accounting data are unchanged.' \
            '' \
            '## Package' \
            '' \
            'Upload ssbhesabfa-v2.3.28.zip through PrestaShop Module Manager and run the module upgrade action.' \
            '' \
            'Validation: all 78 PHP files passed PHP 8.1 lint, both XML files parsed, removed Tools JSON helpers were absent, and the installable ZIP integrity was verified.' \
            > release-notes.md
          gh release create "$TAG" "$ASSET" \
            --target "$TARGET_SHA" \
            --title 'SSB Hesabfa v2.3.28' \
            --notes-file release-notes.md \
            --latest
