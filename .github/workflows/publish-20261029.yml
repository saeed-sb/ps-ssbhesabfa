name: Publish approved source 2026-10-29
on:
  push:
    branches: [codex/publish-20261029]
    paths: [.github/workflows/publish-20261029.yml]
permissions:
  contents: read
concurrency:
  group: approved-release-2.3.44
  cancel-in-progress: false
env:
  SOURCE_SHA: '63022ed86c69191384040a235ac17375f86069fa'
  RELEASE_VERSION: '2.3.44'
  MODULE_NAME: ssbhesabfa
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.1'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint and behavioral regression tests
        run: |
          set -euo pipefail
          git ls-files -z '*.php' | xargs -0 -r -n1 php -l
          for t in freight_margin_upgrade queue_repository_guards log_level_mapping invoice_item_pagination invoice_carrier_upgrade manual_payment_reconciliation module_security_bootstrap paymenthub_compatibility queue_webhook_recovery security_boundaries payment_fee_expense invoice_stock_history invoice_stock_only; do php "tests/$t.php"; done
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Assemble verified source package without running candidate code
        run: |
          python3 -I - <<'PY'
          import hashlib,json,os,pathlib,subprocess,zipfile
          root=pathlib.Path.cwd()
          module=os.environ['MODULE_NAME']; version=os.environ['RELEASE_VERSION']
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert sha==os.environ['SOURCE_SHA']
          excluded={'.github','.ci','.release','tests','docs','changes','_dev','node_modules','dist','build','backups','cache','logs','__pycache__'}
          out=root/'dist';out.mkdir(exist_ok=True)
          archive=out/(module+'-v'+version+'.zip'); inventory=[]
          with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for name in sorted(subprocess.check_output(['git','ls-files','-z']).decode().split('\0')):
              if not name:continue
              p=pathlib.PurePosixPath(name)
              if any(x in excluded or x.startswith('.') and x!='.htaccess' for x in p.parts):continue
              if p.name=='AGENTS.md' or p.suffix in {'.log','.bak','.orig','.zip'}:continue
              f=root/name
              assert f.is_file() and not f.is_symlink(),name
              data=f.read_bytes(); info=zipfile.ZipInfo(module+'/'+name,(2026,10,29,0,0,0))
              info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=(0o100755 if os.access(f,os.X_OK) else 0o100644)<<16
              z.writestr(info,data)
              inventory.append({'path':module+'/'+name,'sha256':hashlib.sha256(data).hexdigest()})
          with zipfile.ZipFile(archive) as z:
            assert z.testzip() is None
            assert module+'/'+module+'.php' in z.namelist()
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          (out/(archive.name+'.sha256')).write_text(digest+'  '+archive.name+'\n')
          (out/'SHA256SUMS.txt').write_text(digest+'  '+archive.name+'\n')
          (out/'package-manifest.json').write_text(json.dumps({'source_commit':sha,'module':module,'version':version,'files':inventory},indent=2))
          (out/'release-notes.md').write_text('Fix invoice stock synchronization for removed and replaced items, incomplete invoice responses, and include module-owned CLI scheduling. Includes all changes through '+sha+'.\n\nValidation: tracked PHP syntax checks and the selected isolated regression commands in this release workflow. No live provider operations or production deployment. ZIP integrity, source inventory and uploaded SHA-256 verified.\n\nUpgrade in place through PrestaShop Module Manager without uninstalling. This publication does not deploy to production.\n')
          PY
      - name: Create draft, verify uploaded package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" --json isDraft,targetCommitish > "$RUNNER_TEMP/existing.json" 2>/dev/null; then
            test "$(jq -r .isDraft "$RUNNER_TEMP/existing.json")" = true
            test "$(jq -r .targetCommitish "$RUNNER_TEMP/existing.json")" = "$SOURCE_SHA"
          else
            if gh api "repos/$GH_REPO/git/ref/tags/$tag" > "$RUNNER_TEMP/tag.json" 2>/dev/null; then
              type="$(jq -r .object.type "$RUNNER_TEMP/tag.json")"
              sha="$(jq -r .object.sha "$RUNNER_TEMP/tag.json")"
              if [ "$type" = tag ]; then sha="$(gh api "repos/$GH_REPO/git/tags/$sha" --jq .object.sha)"; fi
              test "$sha" = "$SOURCE_SHA"
            fi
            gh release create "$tag" dist/*.zip dist/*.sha256 dist/SHA256SUMS.txt dist/package-manifest.json --target "$SOURCE_SHA" --title "$MODULE_NAME $RELEASE_VERSION" --notes-file dist/release-notes.md --draft
          fi
          mkdir "$RUNNER_TEMP/readback"
          gh release download "$tag" --dir "$RUNNER_TEMP/readback"
          cd "$RUNNER_TEMP/readback"
          sha256sum -c SHA256SUMS.txt
          cmp "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt" SHA256SUMS.txt
          cmp "$GITHUB_WORKSPACE/dist/package-manifest.json" package-manifest.json
          gh release edit "$tag" --draft=false --latest
          type="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.type)"
          sha="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha)"
          if [ "$type" = tag ]; then sha="$(gh api "repos/$GH_REPO/git/tags/$sha" --jq .object.sha)"; fi
          test "$sha" = "$SOURCE_SHA"
