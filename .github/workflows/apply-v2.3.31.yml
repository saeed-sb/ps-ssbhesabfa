name: Apply reviewed v2.3.31 changes

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/apply-v2.3.31.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 5c473cac31da0ae002cf0beb8b2c991226c48bd4

    steps:
      - name: Check out trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          cat > /tmp/ssbhesabfa-v2.3.31.patch <<'PATCH'
          diff --git a/CHANGELOG.md b/CHANGELOG.md
          index 62d3c56..8f0e43b 100644
          --- a/CHANGELOG.md
          +++ b/CHANGELOG.md
          @@ -1,3 +1,11 @@
          +## 2.3.31
          +
          +- Added `{customer_charge_percent}`, `{fee_percent}`, and `{income_percent}` placeholders to automatic and manual fee-income document descriptions.
          +- Exposed the configured customer-charge and gateway-fee rates plus the calculated net income rate in the payment fee breakdown.
          +- Updated default fee-income templates and safely migrates unchanged English or Persian templates to include all three rates.
          +- Expanded back-office help and internal documentation for the new accounting-description placeholders.
          +- Added a standalone configuration-only upgrade handler; mappings, queues, logs, invoices, and accounting records remain unchanged.
          +
           ## 2.3.30
           
           - Fixed `psy_paymenthelper` payment resolution so the currently active gateway method takes precedence over historical short-title configuration keys.
          diff --git a/Readme.md b/Readme.md
          index 6ff3714..634fcf1 100644
          --- a/Readme.md
          +++ b/Readme.md
          @@ -2,7 +2,7 @@
           
           `ssbhesabfa` connects a PrestaShop store to Hesabfa Online Accounting. It synchronizes store data, registers invoices and payments, processes Hesabfa webhooks, and provides reliable queues for operations that should not block checkout or back-office requests.
           
          -- **Current version:** `2.3.30`
          +- **Current version:** `2.3.31`
           - **PrestaShop compatibility:** `1.7.0.0` and newer
           - **Author:** Saeed Sattar Beglou
           
          @@ -146,6 +146,9 @@ Payment and accounting-document descriptions support these placeholders:
           | `{order_reference}` | PrestaShop order reference |
           | `{invoice_number}` | Hesabfa invoice number |
           | `{transaction_number}` | Payment or gateway transaction number |
          +| `{customer_charge_percent}` | Customer extra-charge percentage configured for the payment method |
          +| `{fee_percent}` | Gateway fee percentage configured for the payment method |
          +| `{income_percent}` | Net fee-income percentage relative to the invoice base amount |
           
           ## Webhook synchronization
           
