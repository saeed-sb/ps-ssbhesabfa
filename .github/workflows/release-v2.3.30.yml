name: Release v2.3.30

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release-v2.3.30.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 14a96d6b3df7fbdcc59602765508fedf5a1f4679
      TAG: v2.3.30
      ASSET: ssbhesabfa-v2.3.30.zip

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Validate legacy PHP sources on PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: none

      - name: Lint non-MCP sources on PHP 7.4
        shell: bash
        run: |
          set -euo pipefail
          php -v | grep -Fq 'PHP 7.4.'
          find . \
            -path './.git' -prune -o \
            -path './src' -prune -o \
            -path './vendor' -prune -o \
            -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Set up PHP 8.1 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          php -v | grep -Fq 'PHP 8.1.'
          grep -Fq "\$this->version = '2.3.30';" ssbhesabfa.php
          grep -Fq 'public function isMcpCompliant()' ssbhesabfa.php
          grep -Fq '<version>2.3.30</version>' config.xml
          grep -Fq '<version>2.3.30</version>' config_fa.xml
          grep -Fq '**Current version:** `2.3.30`' Readme.md
          grep -Fq '## 2.3.30' CHANGELOG.md
          test -f upgrade/upgrade-2.3.30.php
          grep -Fq 'function upgrade_module_2_3_30' upgrade/upgrade-2.3.30.php
          test -f src/Mcp/HesabfaTools.php
          test "$(grep -c '#\[PsMcpTool(' src/Mcp/HesabfaTools.php)" -eq 7
          test "$(find . -path './.git' -prune -o -type f -name '*.php' -print | wc -l)" -eq 81
          git diff --check "$TARGET_SHA^" "$TARGET_SHA"
          find . -path './.git' -prune -o -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 -c "import json, xml.etree.ElementTree as ET; json.load(open('composer.json')); ET.parse('config.xml'); ET.parse('config_fa.xml')"
          composer validate --no-check-publish
          composer dump-autoload --no-dev --classmap-authoritative
          php -r "require 'vendor/autoload.php'; exit(class_exists('SsbHesabfa\\Mcp\\HesabfaTools') ? 0 : 1);"

      - name: Build installable module archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ssbhesabfa
          git archive \
            --format=tar \
            "$TARGET_SHA" \
            -- . ':(exclude).gitattributes' ':(exclude).gitignore' \
            | tar -xf - -C build/ssbhesabfa
          cp -a vendor build/ssbhesabfa/vendor
          (
            cd build
            zip -qr "../$ASSET" ssbhesabfa
          )
          unzip -t "$ASSET"
          unzip -Z1 "$ASSET" | grep -Fqx 'ssbhesabfa/vendor/autoload.php'
          unzip -Z1 "$ASSET" | grep -Fqx 'ssbhesabfa/src/Mcp/HesabfaTools.php'
          unzip -Z1 "$ASSET" | grep -Fqx 'ssbhesabfa/upgrade/upgrade-2.3.30.php'
          test "$(unzip -Z1 "$ASSET" | awk '/^ssbhesabfa\/.*\.php$/ && $0 !~ /^ssbhesabfa\/vendor\// { count++ } END { print count + 0 }')" -eq 81
          test "$(unzip -Z1 "$ASSET" | awk '/(^|\/)config(_fa)?\.xml$/ { count++ } END { print count + 0 }')" -eq 2
          test "$(unzip -Z1 "$ASSET" | awk '!/^ssbhesabfa\// { count++ } END { print count + 0 }')" -eq 0
          if unzip -Z1 "$ASSET" | grep -Eiq '(^|/)AGENTS\.md$|(^|/)\.git/|\.bak([.-]|$)|\.log$|(^|/)\.env($|\.)|release-v2\.3\.30\.yml$'; then
            echo 'Development, secret, backup, or temporary workflow file found in release archive.' >&2
            exit 1
          fi
          sha256sum "$ASSET"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## Changes

          - Makes the currently active `psy_paymenthelper` gateway method authoritative when an order stores a shorter payment title.
          - Prevents historical short-title configuration keys from shadowing updated bank, fee, and customer-charge settings.
          - Fixes the Technopay case where the obsolete 6.5% customer charge could override the active 7.5% configuration and leave a customer/invoice balance.
          - Preserves direct legacy configuration only as a compatibility fallback when no active Payment Helper method matches.
          - Adds a no-schema upgrade handler; existing settings, mappings, queues, logs, and accounting data are preserved.

          ## Package

          Upload `ssbhesabfa-v2.3.30.zip` through PrestaShop Module Manager and run the module upgrade action.

          Validation: the resolver regression scenario passed before release; legacy sources passed PHP 7.4 lint; all 81 module PHP files passed PHP 8.1 lint; Composer metadata, MCP discovery, both XML files, release invariants, and ZIP integrity passed.
          NOTES
          gh release create "$TAG" "$ASSET" \
            --target "$TARGET_SHA" \
            --title 'SSB Hesabfa v2.3.30' \
            --notes-file release-notes.md \
            --latest
