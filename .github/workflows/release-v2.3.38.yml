name: Publish SSB Hesabfa v2.3.38

on:
  push:
    branches: [master]
    paths: ['.github/workflows/release-v2.3.38.yml']

permissions:
  contents: read

concurrency:
  group: ssbhesabfa-release-v2.3.38
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: codex_ssbh_security_release
          MYSQL_ROOT_PASSWORD: ssbh_ci_fixture_only
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pssbh_ci_fixture_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 150b0482c6fe8be3b0828ad177c43b8bf2c20840
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, curl
          coverage: none
      - name: Syntax and source identity
        env:
          RELEASE_PHP: ${{ matrix.php }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == '150b0482c6fe8be3b0828ad177c43b8bf2c20840'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip() == '951704f19fa7e995cd66cfc7ad94823becbd9c90'
          files = subprocess.check_output(['git', 'ls-files', '-z'], text=True).split('\0')
          count = 0
          for path in files:
              if not path.endswith('.php') or (os.environ['RELEASE_PHP'] == '7.4' and path.startswith('src/Mcp/')):
                  continue
              subprocess.run(['php', '-l', path], check=True)
              count += 1
          assert count == (99 if os.environ['RELEASE_PHP'] == '7.4' else 100)
          print('Syntax passed:', count, 'files')
          PY
      - name: Isolated PHP and HTTP regressions
        shell: bash
        run: |
          for file in tests/log_level_mapping.php tests/manual_payment_reconciliation.php tests/module_security_bootstrap.php tests/paymenthub_compatibility.php tests/queue_repository_guards.php tests/queue_webhook_recovery.php tests/security_boundaries.php tests/invoice_item_pagination.php; do
            php -d display_errors=1 -d log_errors=0 "$file"
          done
          PHP_BINARY="$(command -v php)" python3 tests/security_http_endpoints.py
      - name: Real-database concurrency regressions
        env:
          SSBH_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=codex_ssbh_security_release;charset=utf8mb4
          SSBH_TEST_MYSQL_USER: root
          SSBH_TEST_MYSQL_PASSWORD: ssbh_ci_fixture_only
        run: php -d display_errors=1 -d log_errors=0 tests/security_concurrency_mysql.php

  publish:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 150b0482c6fe8be3b0828ad177c43b8bf2c20840
          persist-credentials: false
      - name: Build verified installable module package
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, zipfile, xml.etree.ElementTree as ET
          expected = '150b0482c6fe8be3b0828ad177c43b8bf2c20840'
          tree = '951704f19fa7e995cd66cfc7ad94823becbd9c90'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip() == tree
          for name in ('config.xml', 'config_fa.xml'):
              assert ET.parse(name).getroot().findtext('version') == '2.3.38'
          assert "$this->version = '2.3.38';" in pathlib.Path('ssbhesabfa.php').read_text()
          assert json.loads(pathlib.Path('composer.json').read_text())['name'] == 'saeed-sb/ps-ssbhesabfa'
          files = [p for p in subprocess.check_output(['git', 'ls-files', '-z'], text=True).split('\0') if p and not p.startswith('.')]
          output = pathlib.Path('ssbhesabfa-v2.3.38.zip')
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(files):
                  info = zipfile.ZipInfo('ssbhesabfa/' + path, (2026, 10, 13, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  archive.writestr(info, pathlib.Path(path).read_bytes())
          with zipfile.ZipFile(output) as archive:
              assert archive.testzip() is None
              assert len(archive.namelist()) == len(files)
              for path in files:
                  assert archive.read('ssbhesabfa/' + path) == pathlib.Path(path).read_bytes()
              assert all('/.git/' not in p and 'request.conf' not in p and 'error_log' not in p for p in archive.namelist())
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          pathlib.Path('SHA256SUMS-v2.3.38.txt').write_text(digest + '  ' + output.name + '\n')
          pathlib.Path('ssbhesabfa-v2.3.38-validation.txt').write_text(
              'Source commit: ' + expected + '\nSource tree: ' + tree + '\n'
              'Eight isolated PHP regression scripts passed on PHP 7.4 and PHP 8.1.\n'
              'Invoice pagination: 28 and 205 items, server-capped pages, later-batch failure before writes, invalid pages, missing items, leading zeros and empty input passed.\n'
              'HTTP boundary tests, including 1000 invalid webhook requests with zero fixture writes, passed on both runtimes.\n'
              'Real MySQL cross-process financial/queue locks, retry IDs, persistence failures and migrations passed on both runtimes.\n'
              'PHP 7.4 syntax: 99 legacy files passed; PHP 8.1 syntax: all 100 PHP files passed.\n'
              'XML versions and Composer metadata passed.\n'
              'Installable ZIP integrity and byte-for-byte source identity passed: ' + str(len(files)) + ' files.\n'
              'Package SHA-256: ' + digest + '\n')
          pathlib.Path('release-notes.md').write_text('''## Inventory synchronization fix

          Invoice webhooks previously fetched only the default first ten Hesabfa items, leaving later stock quantities stale and logging valid items as missing. This release fetches every requested code with explicit pagination and batches of at most 100 codes.

          All pages are validated before item changes are applied. Failed, repeated, empty or inconsistent pages fail the change instead of accepting partial data. Leading-zero codes and genuinely missing-item warnings are preserved.

          ## Upgrade

          Install the module ZIP and run the module upgrade action. Version 2.3.38 requires no schema or configuration changes and sends no API requests during upgrade. Existing security requirements still apply; see docs/security-2.3.35.md.

          The upgrade does not replay completed webhook changes. Previously skipped stock updates require targeted reconciliation; do not reset the global webhook checkpoint or replay financial writes.

          ## Validation

          Eight isolated regression scripts, HTTP boundary tests and real MySQL cross-process tests passed on PHP 7.4 and 8.1. Syntax checks passed for 99 legacy PHP files and all 100 PHP files respectively. The installable ZIP, source identity and version metadata were verified. The validation report and SHA-256 checksum are attached.
          '''.replace('\n          ', '\n'))
          print('Package files:', len(files))
          print('Package SHA-256:', digest)
          PY
      - name: Publish release with installable ZIP and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v2.3.38 --repo saeed-sb/ps-ssbhesabfa --target 150b0482c6fe8be3b0828ad177c43b8bf2c20840 --draft --title "SSB Hesabfa v2.3.38" --notes-file release-notes.md ssbhesabfa-v2.3.38.zip ssbhesabfa-v2.3.38-validation.txt SHA256SUMS-v2.3.38.txt
          gh release view v2.3.38 --repo saeed-sb/ps-ssbhesabfa --json assets --jq '.assets | length' | grep -qx 3
          gh release edit v2.3.38 --repo saeed-sb/ps-ssbhesabfa --draft=false --latest
