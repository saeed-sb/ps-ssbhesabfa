name: Release v2.3.33

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release-v2.3.33.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: f3e093c6ea1ff77409ec0b1d1de366b9ee0e821a
      TAG: v2.3.33
      ASSET: ssbhesabfa-v2.3.33.zip

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Validate legacy PHP sources on PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: none

      - name: Lint and test non-MCP sources on PHP 7.4
        shell: bash
        run: |
          set -euo pipefail
          php -v | grep -Fq 'PHP 7.4.'
          find . \
            -path './.git' -prune -o \
            -path './src' -prune -o \
            -path './vendor' -prune -o \
            -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l
          php tests/log_level_mapping.php
          php tests/paymenthub_compatibility.php

      - name: Set up PHP 8.1 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          php -v | grep -Fq 'PHP 8.1.'
          grep -Fq "\$this->version = '2.3.33';" ssbhesabfa.php
          grep -Fq '<version>2.3.33</version>' config.xml
          grep -Fq '<version>2.3.33</version>' config_fa.xml
          grep -Fq '## 2.3.33' CHANGELOG.md
          test -f upgrade/upgrade-2.3.33.php
          grep -Fq 'function upgrade_module_2_3_33' upgrade/upgrade-2.3.33.php
          test -f tests/log_level_mapping.php
          test "$(find . -path './.git' -prune -o -path './vendor' -prune -o -type f -name '*.php' -print | wc -l)" -eq 86
          git diff --check "$TARGET_SHA^" "$TARGET_SHA"
          find . -path './.git' -prune -o -path './vendor' -prune -o -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/log_level_mapping.php
          php tests/paymenthub_compatibility.php
          python3 -c "import json, xml.etree.ElementTree as ET; json.load(open('composer.json')); ET.parse('config.xml'); ET.parse('config_fa.xml')"
          composer validate --no-check-publish
          composer dump-autoload --no-dev --classmap-authoritative
          php -r "require 'vendor/autoload.php'; exit(class_exists('SsbHesabfa\\Mcp\\HesabfaTools') ? 0 : 1);"

      - name: Build installable module archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ssbhesabfa
          git archive \
            --format=tar \
            "$TARGET_SHA" \
            -- . ':(exclude).gitattributes' ':(exclude).gitignore' \
            | tar -xf - -C build/ssbhesabfa
          cp -a vendor build/ssbhesabfa/vendor
          (
            cd build
            zip -qr "../$ASSET" ssbhesabfa
          )
          unzip -t "$ASSET"
          unzip -Z1 "$ASSET" | grep -Fqx 'ssbhesabfa/vendor/autoload.php'
          unzip -Z1 "$ASSET" | grep -Fqx 'ssbhesabfa/tests/log_level_mapping.php'
          unzip -Z1 "$ASSET" | grep -Fqx 'ssbhesabfa/upgrade/upgrade-2.3.33.php'
          test "$(unzip -Z1 "$ASSET" | awk '/^ssbhesabfa\/.*\.php$/ && $0 !~ /^ssbhesabfa\/vendor\// { count++ } END { print count + 0 }')" -eq 86
          test "$(unzip -Z1 "$ASSET" | awk '/(^|\/)config(_fa)?\.xml$/ { count++ } END { print count + 0 }')" -eq 2
          test "$(unzip -Z1 "$ASSET" | awk '!/^ssbhesabfa\// { count++ } END { print count + 0 }')" -eq 0
          if unzip -Z1 "$ASSET" | grep -Eiq '(^|/)AGENTS\.md$|(^|/)\.git/|(^|/)(cache|logs?)/|\.bak([.-]|$)|\.backup([.-]|$)|\.log$|(^|/)\.env($|\.)|release-v2\.3\.33\.yml$'; then
            echo 'Development, secret, runtime, backup, or temporary workflow file found in release archive.' >&2
            exit 1
          fi
          sha256sum "$ASSET"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## Changes

          - Fixes PHP 8 log-level normalization so successful INFO operations are no longer shown as CRITICAL.
          - Prevents concurrent webhook and cron workers from processing the journal at the same time.
          - Defers transient Hesabfa API and network failures without flooding failure logs.
          - Raises the default webhook cron batch to 80, with a manual cap of 100.
          - Collapses superseded product-price changes while applying the latest value in checkpoint order.
          - Adds a focused log-level regression test and a no-schema upgrade handler.

          ## Upgrade

          Upload ssbhesabfa-v2.3.33.zip through PrestaShop Module Manager and run the module upgrade action. Existing settings, mappings, queues, logs, invoices, and accounting records are preserved.

          ## Validation

          The release source was matched to the active iPhoneChi production module. All 86 module PHP files passed PHP 8.1 lint, legacy sources and regression tests passed PHP 7.4, Composer metadata and both XML files were validated, and the installable ZIP passed integrity checks.
          NOTES
          gh release create "$TAG" "$ASSET" \
            --target "$TARGET_SHA" \
            --title 'SSB Hesabfa v2.3.33' \
            --notes-file release-notes.md \
            --latest
