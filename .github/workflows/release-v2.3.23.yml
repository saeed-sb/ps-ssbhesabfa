name: Release v2.3.23

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release-v2.3.23.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 07062911bf8c050f50a38bf51bfcfe5ae7b58798
      TAG: v2.3.23
      ASSET: ssbhesabfa-v2.3.23.zip
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          grep -Fq "\$this->version = '2.3.23';" ssbhesabfa.php
          grep -Fq '<version>2.3.23</version>' config.xml
          grep -Fq '<version>2.3.23</version>' config_fa.xml
          test -f upgrade/upgrade-2.3.23.php
          grep -Fq 'function upgrade_module_2_3_23' upgrade/upgrade-2.3.23.php
          grep -Fq "Module::isInstalled('ssbpurchaseprocess')" classes/traits/HesabfaPaymentTrait.php
          grep -Fq "Module::isEnabled('ssbpurchaseprocess')" classes/traits/HesabfaPaymentTrait.php
          grep -Fq 'submit.ssbhesabfaConfirm' views/js/admin.js
          test "$(grep -Fc '.ssb-confirm-form, .ssb-inline-action-form, .ssb-inline-action-form-last' views/js/admin.js)" -eq 1
          ! grep -Fq 'class="ssb-inline-action-form" class=' classes/traits/HesabfaAdminUiTrait.php

      - name: Build installable module archive
        shell: bash
        run: |
          set -euo pipefail
          git archive \
            --format=zip \
            --prefix=ssbhesabfa/ \
            --output="$ASSET" \
            "$TARGET_SHA" \
            -- . ':(exclude).gitattributes' ':(exclude).gitignore'
          unzip -t "$ASSET"
          test "$(unzip -Z1 "$ASSET" | awk '/\.php$/ { count++ } END { print count + 0 }')" -eq 73
          test "$(unzip -Z1 "$ASSET" | awk '/(^|\/)config(_fa)?\.xml$/ { count++ } END { print count + 0 }')" -eq 2
          test "$(unzip -Z1 "$ASSET" | awk '!/^ssbhesabfa\// { count++ } END { print count + 0 }')" -eq 0
          unzip -Z1 "$ASSET" | grep -Fqx 'ssbhesabfa/upgrade/upgrade-2.3.23.php'
          if unzip -Z1 "$ASSET" | grep -Eiq '(^|/)AGENTS\.md$|(^|/)\.git/|\.bak([.-]|$)|\.log$|(^|/)\.env($|\.)'; then
            echo 'Development, secret, or backup file found in release archive.' >&2
            exit 1
          fi
          sha256sum "$ASSET"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi
          printf '%s\n' \
            '## Changes' \
            '' \
            '- Makes `ssbpurchaseprocess` optional for invoice notes; missing, disabled, incomplete, or invalid dependency data now returns an empty note instead of causing a fatal error.' \
            '- Prevents duplicate confirmation dialogs for item-code mapping and other inline admin actions.' \
            '- Namespaces and de-duplicates the delegated confirmation handler and removes the duplicate form `class` attribute.' \
            '- Includes the no-schema PrestaShop upgrade handler from v2.3.22.' \
            '' \
            '## Package' \
            '' \
            'Upload `ssbhesabfa-v2.3.23.zip` through PrestaShop Module Manager and run the module upgrade action.' \
            '' \
            'Validation: 73 PHP files parsed successfully, two XML files validated, JavaScript syntax checked, duplicate-handler regression simulation passed, and the installable ZIP integrity was verified.' \
            > release-notes.md
          gh release create "$TAG" "$ASSET" \
            --target "$TARGET_SHA" \
            --title 'SSB Hesabfa v2.3.23' \
            --notes-file release-notes.md \
            --latest