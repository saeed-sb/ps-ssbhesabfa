name: Release v2.3.21

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release-v2.3.21.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v2.3.21
      RELEASE_SHA: e29923a66b95f26e9b4847e3eaae1d2e2c0a6784
      RELEASE_ASSET: ssbhesabfa-v2.3.21.zip
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release target
        shell: bash
        run: |
          set -euxo pipefail
          git cat-file -e "${RELEASE_SHA}^{commit}"
          actual_tree="$(git rev-parse "${RELEASE_SHA}^{tree}")"
          test "${actual_tree}" = "451ef3adcc151bbfdbf115c0ae81dd411210b0f4"
          git show "${RELEASE_SHA}:ssbhesabfa.php" | grep -Fq "\$this->version = '2.3.21';"
          git show "${RELEASE_SHA}:config.xml" | grep -Fq '<version>2.3.21</version>'
          git show "${RELEASE_SHA}:config_fa.xml" | grep -Fq '<version>2.3.21</version>'
          if git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | grep -q .; then
            echo "Tag ${RELEASE_TAG} already exists." >&2
            exit 1
          fi

      - name: Build installable module package
        shell: bash
        run: |
          git archive --format=zip --prefix=ssbhesabfa/ \
            -o "${RELEASE_ASSET}" "${RELEASE_SHA}" -- . \
            ':(exclude).gitattributes' ':(exclude).gitignore'
          unzip -t "${RELEASE_ASSET}"
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('ssbhesabfa-v2.3.21.zip') as archive:
              names = archive.namelist()
              assert names and all(name.startswith('ssbhesabfa/') for name in names)
              assert 'ssbhesabfa/upgrade/upgrade-2.3.21.php' in names
              assert not any('/.git/' in name or name.endswith('/AGENTS.md') or '.bak-' in name for name in names)
          PY
          sha256sum "${RELEASE_ASSET}"

      - name: Create tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "${RELEASE_TAG}" "${RELEASE_SHA}" -m "Release ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"
          cat > release-notes.md <<'EOF'
          ## Changes

          - Manual **Sync changes** now reports API failures, no-change results, partial failures, processed counts, remaining work, and the last checkpoint accurately.
          - Webhook journal, item-fetch, completion-state, and checkpoint persistence failures are no longer silently accepted.
          - Incoming Hesabfa items are skipped without an error when their tagged PrestaShop product, combination, or local mapping no longer exists.
          - Persian translations and module documentation were updated.
          - Includes the no-schema upgrade handler from `2.3.20` to `2.3.21`.

          ## Package

          Upload `ssbhesabfa-v2.3.21.zip` through PrestaShop Module Manager and run the module upgrade action.
          EOF
          gh release create "${RELEASE_TAG}" "${RELEASE_ASSET}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${RELEASE_SHA}" \
            --title "SSB Hesabfa v2.3.21" \
            --notes-file release-notes.md \
            --latest
