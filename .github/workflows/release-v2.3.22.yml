name: Release v2.3.22

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release-v2.3.22.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 317c35fdf37250a4c13fd2ee9dba455c6672c48d
      TAG: v2.3.22
      ASSET: ssbhesabfa-v2.3.22.zip
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          grep -Fq "\$this->version = '2.3.22';" ssbhesabfa.php
          grep -Fq '<version>2.3.22</version>' config.xml
          grep -Fq '<version>2.3.22</version>' config_fa.xml
          test -f upgrade/upgrade-2.3.22.php
          grep -Fq 'function upgrade_module_2_3_22' upgrade/upgrade-2.3.22.php
          grep -Fq 'normalizePaymentLookupName' classes/traits/HesabfaPaymentTrait.php

      - name: Build installable module archive
        shell: bash
        run: |
          set -euo pipefail
          git archive \
            --format=zip \
            --prefix=ssbhesabfa/ \
            --output="$ASSET" \
            "$TARGET_SHA" \
            -- . ':(exclude).gitattributes' ':(exclude).gitignore'
          unzip -t "$ASSET"
          test "$(unzip -Z1 "$ASSET" | awk '/\.php$/ { count++ } END { print count + 0 }')" -eq 72
          test "$(unzip -Z1 "$ASSET" | awk '/(^|\/)config(_fa)?\.xml$/ { count++ } END { print count + 0 }')" -eq 2
          if unzip -Z1 "$ASSET" | grep -Eiq '(^|/)AGENTS\.md$|(^|/)\.git/|\.bak([.-]|$)|\.log$'; then
            echo 'Development or backup file found in release archive.' >&2
            exit 1
          fi
          sha256sum "$ASSET"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi
          printf '%s\n' \
            '## Payment method lookup fix' \
            '' \
            '- Resolves short `psy_paymenthelper` order titles such as `تارا` against the configured full gateway title such as `درگاه پرداخت تارا`.' \
            '- Preserves the existing payment configuration key, including the Hesabfa bank code, fee type, fee payer and related fee settings.' \
            '- Normalizes the Persian gateway prefix, repeated whitespace and letter case only during lookup.' \
            '- Includes a no-schema PrestaShop upgrade handler from v2.3.21.' \
            '' \
            'Validation: PHP 7.4 parser check for 72 PHP files, two XML files validated, focused payment lookup regression tests passed, and the installable ZIP integrity was verified.' \
            > release-notes.md
          gh release create "$TAG" "$ASSET" \
            --target "$TARGET_SHA" \
            --title 'SSB Hesabfa v2.3.22' \
            --notes-file release-notes.md
