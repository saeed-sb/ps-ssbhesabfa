name: Release v2.3.25

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release-v2.3.25.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: d5eb57f97f4def0a3e9ded5e40c1b508523535c2
      TAG: v2.3.25
      ASSET: ssbhesabfa-v2.3.25.zip
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          grep -Fq "\$this->version = '2.3.25';" ssbhesabfa.php
          grep -Fq '<version>2.3.25</version>' config.xml
          grep -Fq '<version>2.3.25</version>' config_fa.xml
          test -f upgrade/upgrade-2.3.25.php
          grep -Fq 'function upgrade_module_2_3_25' upgrade/upgrade-2.3.25.php
          grep -Fq 'private function acquireProductSyncLocks(array $idProducts)' classes/traits/HesabfaSyncTrait.php
          grep -Fq 'private function recoverMissingItemMappings(array &$items)' classes/traits/HesabfaSyncTrait.php
          grep -Fq "'operator' => 'in'" classes/traits/HesabfaSyncTrait.php
          grep -Fq 'PRODUCT_MAPPING_PERSIST_FAILED' classes/traits/HesabfaSyncTrait.php
          grep -Fq 'Empty therefore means "unchanged".' classes/services/HesabfaProductMappingService.php
          grep -Fq 'ON DUPLICATE KEY UPDATE id_hesabfa = VALUES(id_hesabfa)' classes/HesabfaMappingRepository.php
          find . -path './.git' -prune -o -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('config.xml'); ET.parse('config_fa.xml')"

      - name: Build installable module archive
        shell: bash
        run: |
          set -euo pipefail
          git archive \
            --format=zip \
            --prefix=ssbhesabfa/ \
            --output="$ASSET" \
            "$TARGET_SHA" \
            -- . ':(exclude).gitattributes' ':(exclude).gitignore'
          unzip -t "$ASSET"
          test "$(unzip -Z1 "$ASSET" | awk '/\.php$/ { count++ } END { print count + 0 }')" -eq 75
          test "$(unzip -Z1 "$ASSET" | awk '/(^|\/)config(_fa)?\.xml$/ { count++ } END { print count + 0 }')" -eq 2
          test "$(unzip -Z1 "$ASSET" | awk '!/^ssbhesabfa\// { count++ } END { print count + 0 }')" -eq 0
          unzip -Z1 "$ASSET" | grep -Fqx 'ssbhesabfa/upgrade/upgrade-2.3.25.php'
          if unzip -Z1 "$ASSET" | grep -Eiq '(^|/)AGENTS\.md$|(^|/)\.git/|\.bak([.-]|$)|\.log$|(^|/)\.env($|\.)'; then
            echo 'Development, secret, or backup file found in release archive.' >&2
            exit 1
          fi
          sha256sum "$ASSET"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi
          printf '%s\n' \
            '## Changes' \
            '' \
            '- Prevents empty product-form fields from silently deleting existing Hesabfa item mappings.' \
            '- Serializes concurrent product and combination synchronization across PHP processes.' \
            '- Recovers missing mappings from exact Hesabfa ProductCode and JSON Tag matches before a request can create a new item.' \
            '- Persists mappings atomically and reports local persistence failures instead of logging false success.' \
            '- Logs all duplicate candidates while deterministically keeping the oldest matching Hesabfa item as the canonical mapping.' \
            '- Includes a no-schema PrestaShop upgrade handler for version 2.3.25.' \
            '' \
            '## Package' \
            '' \
            'Upload ssbhesabfa-v2.3.25.zip through PrestaShop Module Manager and run the module upgrade action.' \
            '' \
            'Validation: 75 PHP files parsed successfully, two XML files validated, release invariants checked, and the installable ZIP integrity was verified.' \
            > release-notes.md
          gh release create "$TAG" "$ASSET" \
            --target "$TARGET_SHA" \
            --title 'SSB Hesabfa v2.3.25' \
            --notes-file release-notes.md \
            --latest
