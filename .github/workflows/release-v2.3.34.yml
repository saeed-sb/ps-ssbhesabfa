name: Release v2.3.34

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release-v2.3.34.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 36eeea65f53de9833a5679d14951f43c496f1fde
      TAG: v2.3.34
      ASSET: ssbhesabfa-v2.3.34.zip

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Validate legacy PHP sources on PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: none

      - name: Lint and test non-MCP sources on PHP 7.4
        shell: bash
        run: |
          set -euo pipefail
          php -v | grep -Fq 'PHP 7.4.'
          find . \
            -path './.git' -prune -o \
            -path './src' -prune -o \
            -path './vendor' -prune -o \
            -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l
          php tests/log_level_mapping.php
          php tests/paymenthub_compatibility.php
          php tests/manual_payment_reconciliation.php
          php tests/queue_repository_guards.php
          php tests/queue_webhook_recovery.php

      - name: Set up PHP 8.1 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          php -v | grep -Fq 'PHP 8.1.'
          grep -Fq "\$this->version = '2.3.34';" ssbhesabfa.php
          grep -Fq '<version>2.3.34</version>' config.xml
          grep -Fq '<version>2.3.34</version>' config_fa.xml
          grep -Fq '## 2.3.34' CHANGELOG.md
          test -f upgrade/upgrade-2.3.34.php
          grep -Fq 'function upgrade_module_2_3_34' upgrade/upgrade-2.3.34.php
          test -f tests/log_level_mapping.php
          test "$(find . -path './.git' -prune -o -path './vendor' -prune -o -type f -name '*.php' -print | wc -l)" -eq 90
          git diff --check "$TARGET_SHA^" "$TARGET_SHA"
          find . -path './.git' -prune -o -path './vendor' -prune -o -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/log_level_mapping.php
          php tests/paymenthub_compatibility.php
          php tests/manual_payment_reconciliation.php
          php tests/queue_repository_guards.php
          php tests/queue_webhook_recovery.php
          python3 -c "import json, xml.etree.ElementTree as ET; json.load(open('composer.json')); ET.parse('config.xml'); ET.parse('config_fa.xml')"
          composer validate --no-check-publish
          composer dump-autoload --no-dev --classmap-authoritative
          php -r "require 'vendor/autoload.php'; exit(class_exists('SsbHesabfa\\Mcp\\HesabfaTools') ? 0 : 1);"

      - name: Build installable module archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ssbhesabfa
          git archive \
            --format=tar \
            "$TARGET_SHA" \
            -- . ':(exclude).gitattributes' ':(exclude).gitignore' \
            | tar -xf - -C build/ssbhesabfa
          cp -a vendor build/ssbhesabfa/vendor
          (
            cd build
            zip -qr "../$ASSET" ssbhesabfa
          )
          unzip -t "$ASSET"
          unzip -Z1 "$ASSET" | grep -Fqx 'ssbhesabfa/vendor/autoload.php'
          unzip -Z1 "$ASSET" | grep -Fqx 'ssbhesabfa/tests/log_level_mapping.php'
          unzip -Z1 "$ASSET" | grep -Fqx 'ssbhesabfa/upgrade/upgrade-2.3.34.php'
          test "$(unzip -Z1 "$ASSET" | awk '/^ssbhesabfa\/.*\.php$/ && $0 !~ /^ssbhesabfa\/vendor\// { count++ } END { print count + 0 }')" -eq 90
          test "$(unzip -Z1 "$ASSET" | awk '/(^|\/)config(_fa)?\.xml$/ { count++ } END { print count + 0 }')" -eq 2
          test "$(unzip -Z1 "$ASSET" | awk '!/^ssbhesabfa\// { count++ } END { print count + 0 }')" -eq 0
          if unzip -Z1 "$ASSET" | grep -Eiq '(^|/)AGENTS\.md$|(^|/)\.git/|(^|/)(cache|logs?)/|\.bak([.-]|$)|\.backup([.-]|$)|\.log$|(^|/)\.env($|\.)|release-v2\.3\.33\.yml$'; then
            echo 'Development, secret, runtime, backup, or temporary workflow file found in release archive.' >&2
            exit 1
          fi
          sha256sum "$ASSET"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## Changes

          - Verifies completed manual invoice payments and fee-income documents directly in Hesabfa before accepting retries.
          - Restores deleted records only after explicit manual-form resubmission; blocks changed amounts, accounts, conflicting document details, or unavailable verification.
          - Retains receipt/document numbers, serializes submissions per invoice, and distinguishes existing payments from newly registered payments.
          - Adds Persian messages and 13 manual-payment regression checks.
          - Includes queue fixes since v2.3.33: uncached worker locks, guarded repository writes, stale webhook recovery under the processing lock, and inventory refresh after invoice deletion.
          - Adds a no-schema upgrade handler.

          ## Upgrade

          Upload ssbhesabfa-v2.3.34.zip through PrestaShop Module Manager and run the module upgrade action. The upgrade preserves settings, mappings, queues, logs, invoices, and accounting records, and does not replay financial operations.

          ## Validation

          All five CLI regression scripts passed on PHP 7.4 and PHP 8.1. Legacy sources passed PHP 7.4 lint; all 90 source PHP files passed PHP 8.1 lint. Composer metadata and autoload discovery, both XML files, version consistency, and installable ZIP integrity were verified.
          NOTES
          printf '\nPackage SHA-256: `%s`\n' "$(sha256sum "$ASSET" | cut -d' ' -f1)" >> release-notes.md
          gh release create "$TAG" "$ASSET" \
            --target "$TARGET_SHA" \
            --title 'SSB Hesabfa v2.3.34' \
            --notes-file release-notes.md \
            --latest
